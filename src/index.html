<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talal | FA23-BCT-051</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000015;
            text-align: center;
            width: 400px;
            max-width: 85%;
        }
        h1 { color: #2563eb; }
        p { color: #475569; }
        input {
            padding: 12px;
            width: 85%;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #1d4ed8; }
        #message, #output { color: #16a34a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="main-heading">Talal's CI/CD Project</h1>
        <p id="student">Student: Talal</p>
        <p id="roll-number">Roll Number: FA23-BCT-051</p>

        <button id="greet" onclick="showGreeting()">Click Me!</button>
        <p id="message"></p>

        <input type="text" id="user-input" placeholder="Enter some text">
        <button id="submit" onclick="showInput()">Submit</button>
        <p id="output"></p>
    </div>

    <script>
        function showGreeting() {
            document.getElementById("message").textContent =
                "Hello Talal! CI/CD is working!";
        }

        function showInput() {
            const value = document.getElementById("user-input").value;
            document.getElementById("output").textContent = value;
        }
    </script>
</body>
</html>
